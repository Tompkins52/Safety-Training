{% extends "base.html" %}
{% block title %}Change password · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Change password</h1>
  {% if current_user.must_change_password %}
  <p class="muted">You are using a temporary password. Choose a new one to continue.</p>
  {% endif %}
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label>New password <small class="muted">(at least 10 characters)</small>
      <input type="password" name="new_password" required minlength="10" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10" autocomplete="new-password">
    </label>
    <button class="btn btn-primary" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
