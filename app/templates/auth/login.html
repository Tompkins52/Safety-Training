{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign in</h1>
  <p class="muted">Use your work email address and password.</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label class="checkbox"><input type="checkbox" name="remember"> Keep me signed in on this device</label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">Forgot your password? Ask your supervisor or the safety administrator to reset it.</p>
</div>
{% endblock %}
